[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eurysx"
version = "0.0.1"
description = "Local usage intelligence for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "openlines"}]
dependencies = []

[project.scripts]
eurysx = "eurysx:main"

[tool.setuptools]
py-modules = ["eurysx"]
