name: Publish Eurysx

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "v$version"
      - run: python -m pip install .
      - run: PYTHONPATH=src python -m unittest -v tests/test_eurysx.py
      - run: python tests/live_test.py
      - run: python -m py_compile src/eurysx/*.py src/eurysx/collectors/*.py src/eurysx/imports/*.py
      - run: git diff --check
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - uses: actions/checkout@v4
      - name: Extract version changelog
        id: changelog
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          version = os.environ["VERSION"].removeprefix("v")
          lines = open("CHANGELOG.md").read().splitlines()
          start = next(i + 1 for i, line in enumerate(lines) if line.startswith(f"## [{version}]"))
          end = next((i for i in range(start, len(lines)) if lines[i].startswith("## ")), len(lines))
          notes = "\n".join(lines[start:end]).strip()
          if not notes:
              raise SystemExit("missing changelog notes")
          print("notes<<EOF")
          print(notes)
          print("EOF")
          PY
      - name: Create GitHub Release from changelog
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: dist/*
